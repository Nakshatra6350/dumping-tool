version: 2
updates:
  # The pnpm workspace (root, apps/* and packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine updates; major versions come separately.
      minor-and-patch:
        update-types: [minor, patch]

  # The local development services (also used by CI).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday

  # The workflow files in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
