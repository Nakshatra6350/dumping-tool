name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (no services needed)
        run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same services as local development, so CI tests what developers run.
      - name: Start MySQL, Valkey, S3 and mail
        run: docker compose -f infra/docker-compose.dev.yml up -d --wait
      - name: Create the test buckets
        run: pnpm --filter @dbrb/core dev:buckets
      - name: Integration tests
        run: pnpm test:int
      - name: Service logs, if something failed
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --tail=200

  legacy:
    name: Legacy app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/package-lock.json
      - run: npm ci
      - run: npm test
