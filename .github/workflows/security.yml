name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 03:17 UTC: new advisories appear even when the code does not change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only what ships: development tools are not part of a running DBRB.
      - run: pnpm audit --prod --audit-level high

  codeql:
    name: Code scanning
    # Free for public repositories. A private repository needs GitHub Code Security,
    # so the job is skipped there instead of failing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: New dependencies in this pull request
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
