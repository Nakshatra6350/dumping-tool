<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DBRB">
  <!-- DBRB mark, "Return D": a bold, solid D whose counter is cut as a left-pointing tip,
       so the space inside points back: be right back / restore.
       Brand gradient (app theme): #6366f1 -> #a855f7. -->
  <defs>
    <linearGradient id="dbrb-mark-g" gradientUnits="userSpaceOnUse" x1="20" y1="16" x2="108" y2="112">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <path fill="url(#dbrb-mark-g)" fill-rule="evenodd"
        d="M28 16H60A48 48 0 0 1 60 112H28A8 8 0 0 1 20 104V24A8 8 0 0 1 28 16Z
           M42.5 64L56 42H62A22 22 0 0 1 62 86H56Z"/>
</svg>
